{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="box">

    <h1>Register</h1>

    <form method="POST">

        <label>Name</label>

        <input
            class="form-control mb-3"
            type="text"
            name="name"
            required
        >

        <label>Email</label>

        <input
            class="form-control mb-3"
            type="email"
            name="email"
            required
        >

        <label>Phone</label>

        <input
            class="form-control mb-3"
            type="text"
            name="phone"
            required
        >

        <label>Password</label>

        <input
            class="form-control mb-3"
            type="password"
            name="password"
            required
        >

        <label>Register as</label>

        <select class="form-select mb-3" name="role">

            <option value="user">
                User
            </option>

            <option value="staff">
                Trek Staff
            </option>

        </select>

        <button class="btn btn-main" type="submit">
            Register
        </button>

    </form>

</div>

{% endblock %}
